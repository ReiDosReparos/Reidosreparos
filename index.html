<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rei dos Reparos</title>
    
    <!-- AQUI FICA O ESTILO (CSS) QUE DÁ COR E BELEZA AO SITE -->
    <style>
        /* Estilo geral da página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Cabeçalho azul no topo */
        header {
            background-color: #0d6efd;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Caixa do conteúdo principal */
        .conteudo {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Estilo do botão do WhatsApp */
        .btn-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 50px;
            margin-top: 20px;
            transition: 0.3s;
        }

        /* Efeito de passar o mouse no botão */
        .btn-whatsapp:hover {
            background-color: #1ebc57;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DO SITE -->
    <header>
        <h1>Rei dos Reparos</h1>
        <p>Manutenção, Reformas e Consertos Residenciais</p>
    </header>

    <!-- CORPO DO SITE -->
    <main class="conteudo">
        <h2>Precisa de ajuda na sua casa?</h2>
        <p>Atendimento rápido, profissional e com preço justo. Faça seu orçamento sem compromisso!</p>
        
        <!-- Altere o número abaixo para o seu WhatsApp -->
        <a href="https://wa.me/5500000000000" class="btn-whatsapp" target="_blank">
            💬 Chamar no WhatsApp
        </a>
    </main>

</body>
</html>
